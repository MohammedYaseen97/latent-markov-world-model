# Latent Markov arm — Phase 1 diagnostic probe (20 steps).
#
# Runs Phase 1 for 20 steps on the hard pool to check:
#   - L_RL is nonzero on at least some steps
#   - Reward rate is above 0 (at least occasional correct rollouts)
#   - No NaN or gradient explosion
#
# Usage:
#   python scripts/train_latent.py \
#       --config configs/train_latent_grpo_diag.yaml --phase 1

extends: "configs/train_latent_grpo.yaml"

experiment:
  name: "latent_grpo_diag"
  profile: "diag"

training:
  seed: 11
  learning_rate: 1.0e-6
  num_generations: 128
  batch_size: 4
  micro_batch_size: 128
  gradient_checkpointing: true
  temperature: 1.0
  top_p: 1.0
  max_steps: 20
  logging_steps: 1
  save_steps: 20
