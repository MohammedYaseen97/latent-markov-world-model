# Latent Markov arm — full RTX Pro 6000 Blackwell 96 GB profile (v3 design).
#
# Phase 0: teacher-forced distillation pretraining on L1–L4.
#   Teacher: original frozen Qwen, full context per chunk.
#   Student: backbone (lr=1e-6) + encoder/injector (lr=1e-4).
#   Loss: CE distillation on chunks 2 and 3.
#   No reward needed. No auxiliary losses.
#
# Phase 1: on-policy GRPO on Level 5 hard pool.
#   Strict Markov generation: [z_prefix | generate], no crutch.
#   Pure L_RL. 200 steps × 4 problems × 128 rollouts = 102 400 traces.
#
# VRAM budget (96 GB):
#   Phase 0: teacher (3 GB frozen) + student (3 GB) + AdamW moments (12 GB)
#     + activations for batch=64 × 3 chunks (~21 GB) ≈ 39 GB — very comfortable.
#   Phase 1 rollout: model (3 GB) + KV cache for 512 seqs × ~542 tok ≈ 32 GB total.
#   Phase 1 train:   model (3 GB) + AdamW (15 GB) + logits/activations for
#     micro_batch=128 × 3 chunks ≈ 40 GB → 58 GB total.
#
# Usage:
#   # 1. Build pools (one-time)
#   python scripts/prepare_easy_pool.py --levels 1 2 3 4
#   python scripts/prepare_math_level5_pool.py
#
#   # 2. Phase 0 — distillation pretraining (~2–3h)
#   python scripts/train_latent.py --config configs/train_latent_grpo.yaml --phase 0
#
#   # 3. Phase 0 sanity check
#   python scripts/run_phase0_sanity.py --config configs/train_latent_grpo.yaml
#
#   # 4. Controlled latent baseline eval (must be ~0% on L5)
#   python scripts/eval_passk.py --generation-mode latent_markov_pretrained \
#       --train-config configs/train_latent_grpo.yaml \
#       --arm latent_grpo_pretrained
#
#   # 5. Phase 1 — GRPO (~2–2.5h)
#   python scripts/train_latent.py --config configs/train_latent_grpo.yaml --phase 1
#
#   # 6. Phase 1 eval
#   python scripts/eval_passk.py --generation-mode latent_markov \
#       --train-config configs/train_latent_grpo.yaml \
#       --arm latent_grpo

extends: "configs/train_baseline_grpo.yaml"

experiment:
  name: "latent_grpo"
  profile: "full"
  state_mode: "latent_markov"

# ---------------------------------------------------------------------------
# Latent arm architecture (shared Phase 0 and Phase 1)
# ---------------------------------------------------------------------------
latent_markov:
  latent_dim: 64            # z_h dimension
  hidden_dim: 1536          # Qwen2.5-1.5B last-layer hidden size
  n_chunks: 3               # fixed: chunks per rollout
  chunk_tokens: 341         # tokens per chunk (341 × 3 = 1023 ≈ 1024)

# ---------------------------------------------------------------------------
# Phase 0 — teacher-forced distillation pretraining
# ---------------------------------------------------------------------------
phase0:
  pool_path: "data/math_easy_pool.jsonl"       # L1–L4 only

  n_steps: 400
  batch_size: 64             # problems per step; each generates 3 teacher chunks

  # Learning rates (two param groups)
  lr_backbone: 1.0e-6        # backbone: low — learns to use z without forgetting
  lr_encoder:  1.0e-4        # encoder + injector: higher — learning from scratch

  temperature: 1.0           # teacher generation temperature
  top_p: 1.0

  logging_steps: 10
  save_steps: 50

# ---------------------------------------------------------------------------
# Phase 1 — on-policy GRPO on Level 5 hard pool
# ---------------------------------------------------------------------------
training:
  seed: 11
  # backbone lr — locked for cross-arm fairness
  learning_rate: 1.0e-6
  # G: rollouts per problem per step
  num_generations: 128
  # problems per step: 4 × 128 = 512 sequences/step
  batch_size: 4
  # micro_batch_size for the training forward pass (not rollout generation).
  # At 128: logits ~13 GB/chunk × 3 chunks + model (3 GB) + AdamW (15 GB) ≈ 58 GB.
  micro_batch_size: 128
  use_vllm: false
  vllm_gpu_memory_utilization: ~
  vllm_max_model_len: ~
  gradient_checkpointing: true
  temperature: 1.0
  top_p: 1.0
  max_steps: 200
  logging_steps: 10
  save_steps: 50

phase1_loss:
  adv_clip: 20.0
  grad_clip: 1.0

# ---------------------------------------------------------------------------
# Phase 0 sanity check thresholds — run_phase0_sanity.py
# ---------------------------------------------------------------------------
phase0_sanity:
  n_val_problems: 50          # held-out L1–L4 problems for distill loss check
  ce_loss_threshold: 2.0      # nats; lower is better
  z_variance_threshold: 0.1   # mean per-dim std across problems
  n_z_problems: 100           # problems for z variance and z-transition checks
  z_transition_margin: 0.02   # temporal_delta − cross_variation must exceed this
