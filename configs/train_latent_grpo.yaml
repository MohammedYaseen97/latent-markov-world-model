# Latent Markov arm — full RTX Pro 6000 Blackwell profile (v2 design).
#
# Phase 0: backbone FROZEN; Encoder + ZInjector + OutcomeHead trained ONLINE.
#   Each step: generate G=128 rollouts per problem → re-run with grad → update encoder/ZInj.
#   400 steps × 1 problem × 128 rollouts = 51 200 on-policy trajectories.
# Phase 1: backbone UNFROZEN; on-policy GRPO with live z injection on Level 5 hard pool.
#   200 steps × 1 problem × 128 rollouts = 25 600 fresh rollouts.
#
# batch_size=1 (not 4): Qwen2.5's 151,936-token vocabulary makes the logits tensor
# the VRAM bottleneck in _run_pipeline_with_grad. At B×G sequences and ~541 tok/chunk:
#   B=4 problems → 512 seqs × 541 tok × 151,936 vocab × 2B = 84 GB logits alone → OOM
#   B=1 problem  → 128 seqs × 541 tok × 151,936 vocab × 2B = 21 GB logits → fits
#
# Key v2 changes from v1:
#   - VAE-ELBO removed; replaced by explicit calibration loss L_calib
#   - z_h = μ_h (deterministic during training; no reparameterization noise)
#   - Phase 0 extended to 400 steps (losses were still declining at 200)
#   - Phase 1 λ_trans reduced to 0.3 (maintenance only; E1=0.015 shows transition trained)
#   - Benchmark changed to MATH Level 5 hard pool (~350 problems)
#   - Metric changed to pass@128
#
# Inherits shared training knobs (lr, G, backbone, dtype) from
# train_baseline_grpo.yaml. Only latent-specific fields are set here.
#
# Usage (run in order):
#   # 0a. Rebuild easy pool (Level 1-4 only, no Level 5)
#   python scripts/prepare_easy_pool.py --levels 1 2 3 4
#
#   # 0b. Build Level 5 hard pool (one-time; ~2h on RTX Pro 6000)
#   python scripts/prepare_math_level5_pool.py \
#       --model-id Qwen/Qwen2.5-1.5B-Instruct \
#       --output data/math_level5_hard_pool.jsonl
#
#   # 1. Phase 0 — online encoder pretraining (~4h for 400 steps)
#   python scripts/train_latent.py --config configs/train_latent_grpo.yaml --phase 0
#
#   # 2. NFR6 gate — MUST pass before Phase 1 (~10 min)
#   python scripts/run_nfr6_gate.py --config configs/train_latent_grpo.yaml \
#       --n-problems 200 --n-rollouts 2
#
#   # 3. Controlled latent baseline eval (pretrained backbone + Phase 0 encoder)
#   python scripts/eval_passk.py --generation-mode latent_markov_pretrained \
#       --train-config configs/train_latent_grpo.yaml --arm latent_grpo_pretrained \
#       --output runs/latent_grpo/eval_pretrained.json
#
#   # 4. Phase 1 — joint RL (~2.5h for 200 steps)
#   python scripts/train_latent.py --config configs/train_latent_grpo.yaml --phase 1
#
#   # 5. Phase 1 eval
#   PHASE1_CKPT=$(ls -td artifacts/latent_grpo/*/phase1/final | head -1)
#   python scripts/eval_passk.py --generation-mode latent_markov \
#       --train-config configs/train_latent_grpo.yaml --checkpoint "$PHASE1_CKPT" \
#       --arm latent_grpo --output runs/latent_grpo/eval_phase1.json
#
#   # 6. E1 + E3 Markov diagnostics
#   python scripts/eval_markov_diagnostics.py \
#       --checkpoint "$PHASE1_CKPT" \
#       --config configs/train_latent_grpo.yaml \
#       --n-problems 200 --n-rollouts 4 \
#       --output-dir runs/latent_grpo/diagnostics

extends: "configs/train_baseline_grpo.yaml"

experiment:
  name: "latent_grpo"
  profile: "full"
  state_mode: "latent_markov"

# ---------------------------------------------------------------------------
# Latent arm architecture (shared across Phase 0 and Phase 1)
# ---------------------------------------------------------------------------
latent_markov:
  latent_dim: 64            # z_h dimension
  hidden_dim: 1536          # Qwen2.5-1.5B last-layer hidden size
  n_chunks: 3               # fixed: chunks per rollout
  chunk_tokens: 341         # tokens per chunk (341 × 3 = 1023 ≈ 1024)

# ---------------------------------------------------------------------------
# Phase 0 — Online encoder pretraining on frozen backbone (v2)
# ---------------------------------------------------------------------------
phase0:
  pool_path: "data/math_easy_pool.jsonl"      # L1–L4 only (mutual exclusivity with L5 hard pool)
  checkpoint_path: "runs/latent_grpo/phase0_encoder.pt"

  # 400 steps × 1 problem × 128 rollouts = 51 200 on-policy trajectories.
  # Extended from 200 (v1): losses were still declining at step 200.
  # batch_size=1: logits bottleneck — see header comment.
  n_steps: 400
  batch_size: 1
  num_generations: 128
  # micro_batch_size: how many of the B×G=128 traces are processed per
  # forward/backward call.  Reduces peak VRAM without affecting the math
  # (L_trans/L_out/L_calib are mean-reduced; scaling by 1/n_micro preserves
  # the mean).  32 → 4 forward passes of 32 seqs × 683 tok each:
  #   hidden states 32×683×1536×2 = 0.07 GB  (vs 0.27 GB for all 128)
  #   GC checkpoints 28×32×683×1536×2 = 1.9 GB  (vs 7.5 GB for all 128)
  #   lm_head bypassed in Phase 0 → no logits cost.
  micro_batch_size: 32

  learning_rate: 3.0e-4     # AdamW for Encoder+ZInjector+OutcomeHead; not applied to backbone

  # Loss weights (v2 — no ELBO/KL).
  # Approximate Phase 0 gradient budget at peak (step >= 200):
  #   L_trans × 3.0  →  ~50%   primary: Markov structure
  #   L_out   × 5.0  →  ~23%   outcome quality signal
  #   L_calib × 1.0  →  ~10%   explicit σ² calibration
  #   (remainder: variance across steps)
  lambda_trans_peak: 3.0
  # Warm-start: hold λ_t = 0 for the first 50 steps so L_out can establish a
  # correctness signal before the transition ramp competes for gradient budget.
  # After step 50 the normal linear ramp resumes over the remaining 350 steps.
  lambda_trans_warmup_steps: 50
  lambda_out: 5.0
  lambda_calib: 1.0

  logging_steps: 10
  save_steps: 50

# ---------------------------------------------------------------------------
# Phase 1 — joint GRPO on Level 5 hard pool (inherits baseline training block)
# ---------------------------------------------------------------------------
training:
  seed: 11
  batch_size: 1
  # micro_batch_size: how many of the B×G=128 traces are run per forward/backward
  # in Phase 1.  Advantages are pre-computed over the full group, so splitting the
  # backward does NOT change GRPO correctness — it is pure memory engineering.
  # At micro_batch_size=32: logits tensor = 32×683×151,936×2 = 6.6 GB
  #   vs 128 seqs (full batch) = 26.5 GB.
  # Total Phase 1 peak: 6.6 + 3 (weights) + 15 (AdamW moments) + 2 (GC) ≈ 27 GB.
  micro_batch_size: 32
  # vLLM cannot be used: the 3-chunk loop in grpo_latent.py injects z_h embeddings as
  # input prefix between chunks. vLLM has no hook for this mid-generation state injection.
  # The custom loop uses HF model.generate() per chunk. Explicitly override to false.
  use_vllm: false
  vllm_gpu_memory_utilization: ~
  vllm_max_model_len: ~
  # gradient_checkpointing: REQUIRED for Phase 1 (logits bottleneck from vocab=151,936).
  # At micro_batch_size=32: logits 6.6 GB + GC checkpoints 1.9 GB + weights 3 GB
  # + AdamW moments 15 GB ≈ 27 GB total → very comfortably within 96 GB.
  # Without GC, MLP activations (28 layers × 32 × 683 × 8960 intermediate × 2B)
  # add another ~8.7 GB → 36 GB without GC — still fits, but GC is safe practice.
  gradient_checkpointing: true

# Phase 1 loss weights (v2).
# λ_trans = 0.3: maintenance only — transition already well-trained in Phase 0
#   (E1 diagnostic showed L_trans_held_out = 0.015 after Phase 0).
#   Reduced from 1.0 (v1) to give L_RL more gradient budget headroom.
# λ_calib = 0.5: lighter anchor — keeps σ² calibrated but does not dominate L_RL.
#
# Approximate Phase 1 gradient budget (L_RL≈2, L_trans≈0.6, L_calib≈0.55):
#   L_RL          × 1.0  ≈ 2.0   →  ~65%   primary objective
#   L_trans       × 0.3  ≈ 0.6   →  ~19%   Markov maintenance
#   L_calib       × 0.5  ≈ 0.28  →  ~9%    uncertainty anchor
phase1_loss:
  lambda_trans_peak: 0.3
  lambda_calib: 0.5

# ---------------------------------------------------------------------------
# NFR6 diagnostic — run_nfr6_gate.py
# ---------------------------------------------------------------------------
nfr6:
  output_dir: "runs/latent_grpo/plots"
  method: "umap"
