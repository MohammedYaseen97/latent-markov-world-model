# Latent Markov arm — smoke profile for pipeline verification.
#
# 2 Phase 0 steps + 2 Phase 1 steps. No meaningful learning signal.
# Purpose: confirm the full v3 pipeline (distillation + strict Markov GRPO)
# runs end-to-end without error on a small machine or CI environment.
#
# Usage:
#   python scripts/train_latent.py \
#       --config configs/train_latent_grpo_smoke.yaml --phase 0
#
#   python scripts/train_latent.py \
#       --config configs/train_latent_grpo_smoke.yaml --phase 1

extends: "configs/base_model.yaml"

experiment:
  name: "latent_grpo_smoke"
  profile: "smoke"
  state_mode: "latent_markov"

latent_markov:
  latent_dim: 64
  hidden_dim: 1536
  n_chunks: 3
  chunk_tokens: 341

phase0:
  pool_path: "data/math_easy_pool.jsonl"

  n_steps: 2
  batch_size: 2

  lr_backbone: 1.0e-6
  lr_encoder:  1.0e-4

  temperature: 1.0
  top_p: 1.0

  logging_steps: 1
  save_steps: 10

phase0_sanity:
  n_val_problems: 2
  ce_loss_threshold: 20.0    # very loose for smoke — just checking it runs
  z_variance_threshold: 0.0
  n_z_problems: 2
  n_reward_problems: 2
  teacher_reward_rollouts: 1
  student_reward_rollouts: 1
  coverage_threshold: 0.0    # no coverage requirement for smoke
  min_student_reward: 0.0    # no floor for smoke

training:
  seed: 42
  learning_rate: 1.0e-6
  num_generations: 2
  batch_size: 2
  micro_batch_size: 4
  use_vllm: false
  vllm_gpu_memory_utilization: ~
  vllm_max_model_len: ~
  gradient_checkpointing: false
  temperature: 1.0
  top_p: 1.0
  max_steps: 2
  logging_steps: 1
  save_steps: 10

evaluation:
  path: "data/math_level5_hard_pool.jsonl"

phase1_loss:
  adv_clip: 20.0
  grad_clip: 1.0
