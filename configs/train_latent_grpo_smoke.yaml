# Latent Markov arm — smoke profile for RTX 4060 8 GB (pipeline verification).
#
# Goal: confirm the full Phase 0 + Phase 1 pipeline runs end-to-end without
#       error on a small machine.  2 steps, 2 problems — NO meaningful signal;
#       validates plumbing only.
#
# NFR3: must run end-to-end in < 10 min on the 4060.
#
# Usage:
#   # Phase 0 (online, smoke)
#   python scripts/train_latent.py \
#       --config configs/train_latent_grpo_smoke.yaml --phase 0
#
#   # Phase 1 (smoke)
#   python scripts/train_latent.py \
#       --config configs/train_latent_grpo_smoke.yaml --phase 1

extends: "configs/base_model.yaml"

experiment:
  name: "latent_grpo_smoke"
  profile: "smoke"
  state_mode: "latent_markov"

# ---------------------------------------------------------------------------
# Latent arm architecture
# ---------------------------------------------------------------------------
latent_markov:
  latent_dim: 64
  hidden_dim: 1536
  n_chunks: 3
  chunk_tokens: 341

# ---------------------------------------------------------------------------
# Phase 0 — Online encoder pretraining (smoke)
# ---------------------------------------------------------------------------
phase0:
  pool_path: "data/math_easy_pool.jsonl"
  checkpoint_path: "runs/latent_grpo_smoke/phase0_encoder.pt"

  n_steps: 2
  batch_size: 2
  num_generations: 2

  learning_rate: 3.0e-4
  lambda_trans_peak: 3.0
  lambda_out: 5.0

  logging_steps: 1
  save_steps: 10

# ---------------------------------------------------------------------------
# NFR6 diagnostic
# ---------------------------------------------------------------------------
nfr6:
  output_dir: "runs/latent_grpo_smoke/plots"
  method: "tsne"

# ---------------------------------------------------------------------------
# Phase 1 (smoke)
# ---------------------------------------------------------------------------
training:
  seed: 42
  learning_rate: 1.0e-6
  num_generations: 2
  batch_size: 2
  grad_accum_steps: 1
  max_completion_length: 1024
  temperature: 1.0
  top_p: 1.0
  max_steps: 2
  num_epochs: 1
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 5

evaluation:
  path: "data/math_level5_hard_pool.jsonl"

phase1_loss:
  adv_clip: 5.0
  grad_clip: 1.0
