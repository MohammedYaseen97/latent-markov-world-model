extends: "configs/base_model.yaml"

experiment:
  name: "baseline_grpo"
  state_mode: "history_as_state"
  profile: "full"

training:
  seed: 11

  # Learning rate: Yuan appendix reference (1e-6); same across all arms per contract.
  learning_rate: 1.0e-6

  # Generation group: 128 completions per prompt — matches eval pass@128 scale.
  # TRL constraint: batch_size % num_generations == 0.
  # batch_size = 128 here means 1 unique problem per TRL mini-batch (128 rollouts per problem).
  # grad_accum_steps = 4 → 4 unique problems per optimizer update (same as before).
  # "batch_size" as problems-per-update is unchanged; only TRL's sequence-level knob changes.
  num_generations: 128
  batch_size: 128           # per_device_train_batch_size = 1 problem × 128 rollouts
  grad_accum_steps: 4       # effective problem batch = 4 per weight update

  # Completion budget: 1024 tokens gives enough room for chain-of-thought + \boxed{answer}.
  max_completion_length: 1024

  # Decode settings: same across all arms for fair comparison.
  temperature: 1.0          # Yuan reference; consistent with base_parity.yaml
  top_p: 1.0

  # Training duration: 200 steps for all arms.
  # All arms inherit this budget via the config extends chain for fair comparison.
  num_epochs: 40
  max_steps: 200

  gradient_checkpointing: false   # RTX Pro 6000 Blackwell 96 GB, 1.5B model — not needed (B=128 seq per step)
  use_vllm: false
  logging_steps: 10
  save_steps: 200

evaluation:
  path: "data/math_level5_hard_pool.jsonl"
