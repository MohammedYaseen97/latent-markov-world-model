extends: "configs/base_model.yaml"

experiment:
  name: "baseline_grpo"
  state_mode: "history_as_state"
  profile: "full"

training:
  seed: 11

  # Learning rate: Yuan appendix reference (1e-6); same across all arms per contract.
  learning_rate: 1.0e-6

  # Generation group: 128 completions per prompt — matches eval pass@128 scale.
  # TRL constraint: num_generations % batch_size == 0 (128 % 8 == 0 ✓).
  #
  # batch_size=8: Qwen2.5's 151,936-token vocab + Level 5 prompt lengths (~2048 tok total):
  #   logits tensor = 8 × 2048tok × 151,936vocab × 2B ≈ 5 GB (safe)
  #   batch_size=32 → ~20 GB logits; with MLP activations still live → 65+ GB → OOM
  #   batch_size=8 → even without working gradient_checkpointing: ~37 GB total → fits
  #
  # grad_accum_steps=64 preserves the original effective problem batch:
  #   8 seqs × 64 steps = 512 seqs = 128 rollouts × 4 problems per optimizer update.
  num_generations: 128
  batch_size: 8             # per_device_train_batch_size; 16 steps = 1 problem's rollouts
  grad_accum_steps: 64      # effective problem batch = 4 per weight update

  # Completion budget: 1024 tokens gives enough room for chain-of-thought + \boxed{answer}.
  max_completion_length: 1024

  # Decode settings: same across all arms for fair comparison.
  temperature: 1.0          # Yuan reference; consistent with base_parity.yaml
  top_p: 1.0

  # Training duration: 200 steps for all arms.
  # All arms inherit this budget via the config extends chain for fair comparison.
  num_epochs: 40
  max_steps: 200

  # gradient_checkpointing REQUIRED even on 96 GB: Qwen2.5-1.5B's intermediate_size=8960
  # means MLP activations are ~50 GB at B=32 without GC (28 layers × 32×1524×8960×2 bytes).
  # With GC: recomputes MLP on backward, keeping only layer inputs in memory (~4 GB).
  gradient_checkpointing: true
  use_vllm: true
  # Colocate mode (TRL default): vLLM runs on the same GPU as training.
  # 0.50 × 96 GB = 48 GB for vLLM KV cache; training needs ~22 GB → ~70 GB total, no sleep mode.
  # TRL passes seed=<training.seed> to vLLM SamplingParams automatically → reproducible.
  vllm_gpu_memory_utilization: 0.50
  vllm_max_model_len: 2048  # prompt (~300 tok) + max_completion_length (1024) + headroom
  logging_steps: 10
  save_steps: 200

evaluation:
  path: "data/math_level5_hard_pool.jsonl"
